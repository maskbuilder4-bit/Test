<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
  <!-- TAB 3: VIDEOS (Dynamic Fetch Area) -->
<div id="videos" class="tab-content">
    <div class="content-grid" id="videos-grid-container">
        <!-- Dynamic cards will load here via JavaScript -->
        <div class="content-card">
            <div class="card-thumbnail">[Loading Videos...]</div>
        </div>
    </div>
</div>

<script>
    // Fetch videos list from your GitHub repository raw JSON or pages endpoint
    async function loadDynamicVideos() {
        try {
            // Suppose you maintain a videos.json file in your repo listing uploaded titles and paths
            const response = await fetch('https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/videos.json');
            const videos = await response.json();
            
            const gridContainer = document.getElementById('videos-grid-container');
            gridContainer.innerHTML = ''; // Clear loader

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'content-card';
                card.innerHTML = `
                    <div class="card-thumbnail" style="padding:0; overflow:hidden;">
                        <video src="${video.url}" controls width="100%" height="160" style="object-fit:cover;"></video>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${video.title}</div>
                        <p class="card-desc">${video.description}</p>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        } catch (error) {
            console.error('Error loading videos:', error);
        }
    }

    // Call on page load
    window.addEventListener('DOMContentLoaded', loadDynamicVideos);
</script>

</body>
  </html>
