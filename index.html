<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Mohammad Muhyideen Ghouse Allamgir</title>
</head>
<body>
  <!-- TAB 3: VIDEOS (Dynamic Fetch Area) -->
<div id="videos" class="tab-content">
    <div class="content-grid" id="videos-grid-container">
        <!-- Dynamic cards will load here via JavaScript -->
        <div class="content-card">
            <div class="card-thumbnail">[Loading Videos...]</div>
        </div>
    </div>
</div>

<script>
    // Fetch videos list from your GitHub repository raw JSON endpoint
    async function loadDynamicVideos() {
        try {
            const timestamp = new Date().getTime();
            const response = await fetch(`https://raw.githubusercontent.com/maskbuilder4-bit/Test/main/videos.json?t=${timestamp}`);
            
            if (!response.ok) {
                throw new Error('Failed to fetch videos manifest.');
            }

            const videos = await response.json();
            const gridContainer = document.getElementById('videos-grid-container');
            gridContainer.innerHTML = ''; // Clear loader

            if (!videos || videos.length === 0) {
                gridContainer.innerHTML = '<div class="content-card"><div class="card-body"><div class="card-title">No videos uploaded yet.</div></div></div>';
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'content-card';
                card.innerHTML = `
                    <div class="card-thumbnail" style="padding:0; overflow:hidden; background:#000;">
                        <!-- Added controls and playsinline attributes to guarantee audio playback -->
                        <video src="${video.url}" controls playsinline width="100%" height="160" style="object-fit:cover;"></video>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${video.title}</div>
                        <p class="card-desc">${video.description}</p>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        } catch (error) {
            console.error('Error loading videos:', error);
            document.getElementById('videos-grid-container').innerHTML = '<div class="content-card"><div class="card-body"><div class="card-title">Could not load videos at this time.</div></div></div>';
        }
    }

    // Call on page load
    window.addEventListener('DOMContentLoaded', loadDynamicVideos);
</script>

</body>
</html>
